<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinylo – lag, sorter og miks spillelister</title>
<style>
:root{--bg:#1b1730;--panel:#262042;--panel2:#312a54;--ink:#efeaff;--mute:#a79fcb;--acc:#ffc93c;--acc-ink:#2a2000;--danger:#ff7a8a;--line:#3d3563}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Trebuchet MS","Segoe UI",sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:8px;background:var(--panel2);padding:6px 10px}
button:hover{background:var(--line)}
button.pri{background:var(--acc);color:var(--acc-ink);font-weight:700}
button.pri:hover{background:#ffd868}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
header{padding:14px 20px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line)}
h1{margin:0;font:700 26px Georgia,serif;letter-spacing:.5px}
header span{color:var(--mute)}
header button{margin-left:auto}
.app{flex:1;display:grid;grid-template-columns:230px 1fr 300px;min-height:0}
aside,main,section{overflow:auto;padding:16px}
aside{border-right:1px solid var(--line)}
section{border-left:1px solid var(--line)}
h2{font:700 18px Georgia,serif;margin:0 0 10px}
.pl{display:flex;justify-content:space-between;width:100%;text-align:left;margin-bottom:4px;background:none;padding:8px 10px}
.pl.on{background:var(--panel2);box-shadow:inset 3px 0 var(--acc)}
.pl small{color:var(--mute)}
.row{display:flex;gap:6px;margin:10px 0}
.mix{background:var(--panel);border-radius:12px;padding:12px;margin-top:20px}
.mix select{margin-bottom:8px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.head h2{margin:0;font-size:26px;flex:1}
.head .ren{max-width:200px}
.track{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--panel);margin-bottom:4px;cursor:grab}
.track.drag{opacity:.4}
.track.over{box-shadow:0 -3px var(--acc)}
.track.now{background:var(--panel2);box-shadow:inset 3px 0 var(--acc)}
.track b{display:block}
.track small,.dur{color:var(--mute)}
.cover{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#1b1730;font-weight:700}
.mv button{padding:2px 7px;margin-left:2px}
.song{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.song div{flex:1;min-width:0}
.song b,.song small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small{color:var(--mute)}
.empty{color:var(--mute);padding:24px;border:1px dashed var(--line);border-radius:12px;text-align:center}
footer{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--panel);border-top:1px solid var(--line)}
footer .info{width:220px;min-width:0}
footer .info b,footer .info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
footer .bar i{display:block;height:100%;width:0;background:var(--acc)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);padding:8px 16px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(max-width:900px){.app{grid-template-columns:1fr;overflow:auto;display:block}aside,main,section{overflow:visible;border:0}footer .info{width:110px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Vinylo</h1><span>Lag spillelister, dra for å sortere, miks to til én</span><button id="reset" title="Tilbakestill til eksempeldata">Tilbakestill</button></header>
<div class="app">
  <aside>
    <h2>Spillelistene dine</h2>
    <div id="lists"></div>
    <form class="row" id="newForm"><input id="newName" placeholder="Navn på ny liste" maxlength="40" aria-label="Navn på ny liste"><button class="pri">Lag</button></form>
    <div class="mix">
      <h2>Miks to lister</h2>
      <select id="mixA" aria-label="Første liste"></select>
      <select id="mixB" aria-label="Andre liste"></select>
      <button class="pri" id="mixBtn">Lag mix</button>
    </div>
  </aside>
  <main id="main"></main>
  <section>
    <h2>Finn låter</h2>
    <input id="q" placeholder="Søk etter tittel eller artist" aria-label="Søk">
    <div id="songs"></div>
  </section>
</div>
<footer>
  <div class="info"><b id="npT">Ingen låt valgt</b><small id="npA">Trykk ▶ på en låt</small></div>
  <button id="prev" aria-label="Forrige">⏮</button>
  <button id="play" class="pri" aria-label="Spill / pause">▶</button>
  <button id="next" aria-label="Neste">⏭</button>
  <div class="bar"><i id="prog"></i></div>
  <span id="time" class="dur">0:00</span>
</footer>
<div id="toast" role="status"></div>

<script>
// Alle låter og artister er oppdiktet
const SONGS=[
[1,"Nattbuss til Nowhere","Lilja Vik",214],[2,"Glass i fjellet","Frost & Ferdi",187],[3,"Sommer i bokmål","Mai Strand",203],
[4,"Kaffe klokka tre","Odd Kvist",176],[5,"Neonregn","Lilja Vik",241],[6,"Tåkelur","Bjørk Orkester",262],
[7,"Hjem før lyset","Mai Strand",198],[8,"Sjøsprøyt","Frost & Ferdi",172],[9,"Siste trikk","Odd Kvist",225],
[10,"Blåtimen","Nora Fjeld",208],[11,"Bølgelengde","Nora Fjeld",190],[12,"Gatelykt-blues","Bjørk Orkester",274],
[13,"Pizza på taket","Kjell & Kollektivet",161],[14,"Tolv timers vakt","Kjell & Kollektivet",183],[15,"Kald kaffe, varm hjerne","Odd Kvist",168],
[16,"Ekko","Lilja Vik",230],[17,"Stille fjord","Nora Fjeld",247],[18,"Fredagsfølelse","Mai Strand",195],
[19,"Solnedgang på Ullern","Frost & Ferdi",211],[20,"Lesesal 4","Kjell & Kollektivet",177],[21,"Snøsmelting","Bjørk Orkester",256],
[22,"Dørstokkmila","Nora Fjeld",199],[23,"Morgenpust","Mai Strand",185],[24,"Over og ut","Odd Kvist",219]
].map(([id,t,a,d])=>({id,t,a,d}));
const byId=Object.fromEntries(SONGS.map(s=>[s.id,s]));
const COLORS=["#ffc93c","#ff9f6e","#9fe3c3","#a9b8ff","#ff9fcf","#c9a6ff"];
const KEY="vinylo-v1";
const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function defaults(){const a=uid(),b=uid();return{sel:a,lists:[
 {id:a,name:"Studiefokus",tracks:[6,11,17,21,10]},
 {id:b,name:"Fredagskveld",tracks:[3,13,18,8,19]}]}}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}
if(!state||!Array.isArray(state.lists)||!state.lists.length)state=defaults();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const cur=()=>state.lists.find(l=>l.id===state.sel)||state.lists[0];
let toastT;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800)}

// ---------- Avspilling (simulert) ----------
let nowId=null,nowList=null,pos=0,playing=false,timer=null;
function showNow(){const s=byId[nowId];$("npT").textContent=s?s.t:"Ingen låt valgt";$("npA").textContent=s?s.a:"Trykk ▶ på en låt";$("play").textContent=playing?"⏸":"▶"}
function tick(){const s=byId[nowId];if(!s)return;pos++;if(pos>=s.d){step(1);return}
 $("prog").style.width=(pos/s.d*100)+"%";$("time").textContent=fmt(pos)}
function playSong(id,listId){nowId=id;nowList=listId;pos=0;playing=true;clearInterval(timer);timer=setInterval(tick,1000);showNow();render()}
function step(dir){const l=state.lists.find(x=>x.id===nowList);if(!l||!l.tracks.length)return;
 let i=l.tracks.indexOf(nowId);i=(i+dir+l.tracks.length)%l.tracks.length;playSong(l.tracks[i],l.id)}
$("play").onclick=()=>{if(!nowId){const l=cur();if(l.tracks.length)playSong(l.tracks[0],l.id);return}
 playing=!playing;clearInterval(timer);if(playing)timer=setInterval(tick,1000);showNow()};
$("next").onclick=()=>step(1);$("prev").onclick=()=>step(-1);

// ---------- Rendering ----------
function render(){
 const l=cur();state.sel=l.id;
 $("lists").innerHTML=state.lists.map(x=>`<button class="pl ${x.id===l.id?"on":""}" data-id="${x.id}"><span>${esc(x.name)}</span><small>${x.tracks.length}</small></button>`).join("");
 const opts=state.lists.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
 const a=$("mixA").value,b=$("mixB").value;
 $("mixA").innerHTML=opts;$("mixB").innerHTML=opts;
 $("mixA").value=state.lists.some(x=>x.id===a)?a:state.lists[0].id;
 $("mixB").value=state.lists.some(x=>x.id===b)?b:(state.lists[1]||state.lists[0]).id;
 const total=l.tracks.reduce((n,id)=>n+byId[id].d,0);
 const tracks=l.tracks.length?l.tracks.map((id,i)=>{const s=byId[id];
  return `<div class="track ${id===nowId&&l.id===nowList?"now":""}" draggable="true" data-i="${i}">
   <div class="cover" style="background:${COLORS[id%COLORS.length]}">${esc(s.t[0])}</div>
   <div><b>${esc(s.t)}</b><small>${esc(s.a)}</small></div>
   <span class="dur">${fmt(s.d)}</span>
   <span class="mv"><button data-act="play" aria-label="Spill ${esc(s.t)}">▶</button><button data-act="up" aria-label="Flytt opp">↑</button><button data-act="down" aria-label="Flytt ned">↓</button><button data-act="del" aria-label="Fjern">✕</button></span></div>`}).join("")
  :`<div class="empty">Listen er tom. Trykk «+» på en låt til høyre for å legge den til.</div>`;
 $("main").innerHTML=`<div class="head"><h2>${esc(l.name)}</h2><input class="ren" id="ren" placeholder="Nytt navn" maxlength="40" aria-label="Nytt navn"><button id="renBtn">Endre navn</button><button id="delList">Slett liste</button></div>
  <p class="dur">${l.tracks.length} låter · ${fmt(total)} totalt · dra i en låt for å sortere</p>${tracks}`;
 renderSongs();save();
}
function renderSongs(){
 const q=$("q").value.trim().toLowerCase(),l=cur();
 const f=SONGS.filter(s=>(s.t+" "+s.a).toLowerCase().includes(q));
 $("songs").innerHTML=f.length?f.map(s=>`<div class="song"><div><b>${esc(s.t)}</b><small>${esc(s.a)} · ${fmt(s.d)}</small></div>
  <button data-add="${s.id}" ${l.tracks.includes(s.id)?"disabled":""} aria-label="Legg til ${esc(s.t)}">${l.tracks.includes(s.id)?"✓":"+"}</button></div>`).join("")
  :`<div class="empty">Ingen treff på «${esc(q)}». Prøv en annen tittel eller artist.</div>`;
}

// ---------- Hendelser ----------
$("lists").onclick=e=>{const b=e.target.closest("[data-id]");if(b){state.sel=b.dataset.id;render()}};
$("songs").onclick=e=>{const b=e.target.closest("[data-add]");if(!b)return;const l=cur(),id=+b.dataset.add;
 if(!l.tracks.includes(id)){l.tracks.push(id);toast("Lagt til i "+l.name);render()}};
$("q").oninput=renderSongs;
$("newForm").onsubmit=e=>{e.preventDefault();const n=$("newName").value.trim();if(!n){toast("Skriv et navn først");return}
 const l={id:uid(),name:n,tracks:[]};state.lists.push(l);state.sel=l.id;$("newName").value="";render()};
$("mixBtn").onclick=()=>{
 const A=state.lists.find(x=>x.id===$("mixA").value),B=state.lists.find(x=>x.id===$("mixB").value);
 if(!A||!B||A.id===B.id){toast("Velg to ulike lister");return}
 const out=[],seen=new Set(),n=Math.max(A.tracks.length,B.tracks.length);
 for(let i=0;i<n;i++)for(const t of [A.tracks[i],B.tracks[i]])if(t!==undefined&&!seen.has(t)){seen.add(t);out.push(t)}
 if(!out.length){toast("Begge listene er tomme");return}
 const l={id:uid(),name:`Mix: ${A.name} + ${B.name}`,tracks:out};state.lists.push(l);state.sel=l.id;toast("Mix laget med "+out.length+" låter");render()};
$("reset").onclick=()=>{if(confirm("Tilbakestille alt til eksempeldata?")){state=defaults();nowId=null;playing=false;clearInterval(timer);showNow();render()}};

let dragI=null;
$("main").onclick=e=>{
 const l=cur();
 if(e.target.id==="renBtn"){const n=$("ren").value.trim();if(!n){toast("Skriv et nytt navn først");return}l.name=n;render();return}
 if(e.target.id==="delList"){if(state.lists.length===1){toast("Du må ha minst én liste");return}
  if(confirm(`Slette «${l.name}»?`)){state.lists=state.lists.filter(x=>x.id!==l.id);state.sel=state.lists[0].id;render()}return}
 const b=e.target.closest("[data-act]");if(!b)return;
 const i=+b.closest(".track").dataset.i,act=b.dataset.act;
 if(act==="play")playSong(l.tracks[i],l.id);
 if(act==="del"){l.tracks.splice(i,1);render()}
 if(act==="up"&&i>0){[l.tracks[i-1],l.tracks[i]]=[l.tracks[i],l.tracks[i-1]];render()}
 if(act==="down"&&i<l.tracks.length-1){[l.tracks[i+1],l.tracks[i]]=[l.tracks[i],l.tracks[i+1]];render()}};
$("main").ondragstart=e=>{const t=e.target.closest(".track");if(!t)return;dragI=+t.dataset.i;t.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragI))};
$("main").ondragover=e=>{const t=e.target.closest(".track");if(!t||dragI===null)return;e.preventDefault();
 document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));t.classList.add("over")};
$("main").ondrop=e=>{const t=e.target.closest(".track");if(!t||dragI===null)return;e.preventDefault();
 const l=cur(),to=+t.dataset.i,[m]=l.tracks.splice(dragI,1);l.tracks.splice(to,0,m);dragI=null;render()};
$("main").ondragend=()=>{dragI=null;render()};

showNow();render();
</script>
</body>
</html>
