<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spisa – meny og lagerstatus i kantina</title>
<style>
:root{--bg:#e9f1f3;--card:#fff;--ink:#12263a;--mute:#5d7185;--line:#cfdce2;--ok:#1d8a6b;--low:#e07a00;--out:#c8372d;--acc:#12263a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI","Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px}
button:hover{background:#dbe7ec}
button.on{background:var(--ink);color:#fff}
button:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:3px solid #ff9f1c;outline-offset:2px}
header{background:var(--ink);color:#fff;padding:22px 20px 18px}
.wrap{max-width:900px;margin:0 auto}
header .wrap{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
h1{margin:0;font:700 38px "Rockwell","Roboto Slab",Georgia,serif;letter-spacing:-.5px}
header p{margin:2px 0 0;color:#b9cbd8}
header button{margin-left:auto;background:transparent;color:#fff;border-color:#fff}
header button.on{background:#fff;color:var(--ink)}
main{padding:20px}
h2{font:700 26px "Rockwell","Roboto Slab",Georgia,serif;margin:28px 0 4px}
.sub{color:var(--mute);margin:0 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.days button{min-width:62px}
#bld button{font-weight:700;min-width:70px}
.days button .d{display:block;font-size:12px;opacity:.75;line-height:1.1}
.dish{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:2px 16px;border-left:6px solid var(--line)}
.dish.v{border-left-color:var(--ok)}
.dish h3{margin:0;font-size:18px}
.dish p{margin:0;color:var(--mute);grid-column:1}
.price{font:700 20px "Rockwell",Georgia,serif;grid-row:1/3;grid-column:2;align-self:center}
.tags{grid-column:1/3;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;border-radius:6px;padding:1px 8px;background:#dff1ea;color:#0f5c47}
.tag.a{background:#eef1f4;color:var(--mute)}
.item{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
.item b{font-size:17px}
.bar{grid-column:1/3;height:10px;background:#e3ebef;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.st{font-weight:700}
.ok .bar i{background:var(--ok)}.ok .st{color:var(--ok)}
.low .bar i{background:var(--low)}.low .st{color:var(--low)}
.out .bar i{background:var(--out)}.out .st{color:var(--out)}
.out b{text-decoration:line-through;text-decoration-thickness:1.5px}
.staff{grid-column:1/3;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.staff button{padding:2px 12px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mute)}
.note{background:#fff4d6;border-radius:10px;padding:8px 14px;margin:10px 0}
.meta{color:var(--mute);font-size:14px;margin-top:6px}
footer{padding:20px;color:var(--mute);font-size:14px;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1>Spisa</h1><p>Meny og lagerstatus i studentkantina</p></div>
  <button id="staffBtn" aria-pressed="false">Personalvisning</button>
</div></header>
<main><div class="wrap">
  <div class="chips" id="bld" role="group" aria-label="Velg bygg"></div>
  <h2>Meny</h2>
  <p class="sub" id="open"></p>
  <div class="chips days" id="days" role="tablist" aria-label="Velg dag"></div>
  <div class="chips" id="diet" aria-label="Kostfilter"></div>
  <div id="note"></div>
  <div id="menu"></div>

  <h2 id="stockH">Hva er igjen?</h2>
  <p class="sub">Sjekk før du går ned. Tallene oppdateres av kantinepersonalet.</p>
  <div class="chips" id="cats" aria-label="Kategori"></div>
  <div class="chips"><button id="onlyIn" aria-pressed="false">Skjul utsolgte</button></div>
  <div id="stock"></div>
  <div class="meta" id="upd"></div>
</div></main>
<footer>Prototype med oppdiktede data. Ikke en offisiell tjeneste.<br><button id="reset" style="margin-top:8px;font-size:13px">Tilbakestill lager</button></footer>

<script>
const D=(n,d,p,t,a)=>({n,d,p,t:t||[],a:a||""});
const MENU={
1:[D("Kjøttkaker i brun saus","Potetstappe, ertestuing og tyttebær",89,[],"gluten, melk"),D("Ovnsbakt torsk","Sitronsmør, kokte poteter og gulrot",98,["gf"],"fisk, melk"),D("Linsegryte med kokos","Ris og koriander",85,["vg","gf"]),D("Tomatsuppe","Med brød",55,["v"],"gluten")],
2:[D("Kylling tikka masala","Basmatiris og naan",92,["gf"],"melk"),D("Fiskeburger","Remulade, salat og søtpotetfries",95,[],"fisk, gluten, egg"),D("Falafeltallerken","Hummus, tabbouleh og pitabrød",87,["vg"],"gluten, sesam"),D("Grønnsakssuppe","Med brød",50,["vg"],"gluten")],
3:[D("Pasta carbonara","Bacon, parmesan og egg",86,[],"gluten, egg, melk"),D("Svinekotelett","Råstekte poteter og rødkål",94,["gf"]),D("Ovnsbakt blomkål","Linser, tahini og granateple",84,["vg","gf"],"sesam"),D("Kremet brokkolisuppe","Med brød",55,["v"],"gluten, melk")],
4:[D("Taco-bar","Kjøttdeig eller bønner, tilbehør og tortilla",88,[],"gluten, melk"),D("Laks i ovn","Poteter og dillsaus",99,["gf"],"fisk, melk"),D("Vegetarlasagne","Squash, spinat og ost",86,["v"],"gluten, melk, egg"),D("Gulrotsuppe","Med ingefær og brød",52,["vg"],"gluten")],
5:[D("Fredagspizza","Skinke og ananas eller margherita",79,[],"gluten, melk"),D("Fish and chips","Ertepuré og remulade",96,[],"fisk, gluten, egg"),D("Pizza margherita (vegan)","Veganost og basilikum",79,["vg"],"gluten"),D("Minestrone","Med brød",55,["vg"],"gluten, selleri")]};
const TAGN={v:"Vegetar",vg:"Vegansk",gf:"Glutenfri"};
const ITEMS=[
["Drikke","Monster Energy",24,[9,3,0]],["Drikke","Cola 0,5 l",30,[22,15,8]],["Drikke","Vann med kullsyre",30,[4,20,12]],["Drikke","Smoothie jordbær",12,[0,6,null]],["Drikke","Iskaffe",16,[11,null,9]],
["Mat","Baguett med skinke",10,[3,7,5]],["Mat","Baguett vegetar",8,[6,2,4]],["Mat","Salatboks",10,[0,5,null]],["Mat","Skolebolle",14,[14,9,10]],
["Snacks","Banan",20,[17,12,null]],["Snacks","Proteinbar",15,[2,8,6]],["Snacks","Sjokolade",25,[18,null,14]],["Snacks","Nøtteblanding",12,[7,4,9]]
].map((x,i)=>({id:i,cat:x[0],n:x[1],max:x[2],def:x[3]}));
const BK=["P35","P32","P48"];
const BLD={P35:{h:"08:00–15:00",hot:[0,1,2,3],txt:"Hovedkantina. Varm mat serveres fra 11:00."},P32:{h:"08:30–14:30",hot:[0,2,3],txt:"Mindre meny med færre varmretter."},P48:{h:"09:00–14:00",hot:[2,3],txt:"Kafé med vegetarrett og suppe."}};
const mk=()=>Object.fromEntries(BK.map((b,k)=>[b,{t:null,left:Object.fromEntries(ITEMS.filter(i=>i.def[k]!=null).map(i=>[i.id,i.def[k]]))}]));
const KEY="spisa-v2",$=id=>document.getElementById(id);
let st;try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!st||!BK.every(b=>st[b]&&st[b].left))st=mk();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const dow=new Date().getDay(),weekend=dow===0||dow===6;
let bld="P35",day=weekend?1:dow,cat="Alle",staff=false,only=false,diet=new Set();
const NAMES=["","Man","Tir","Ons","Tor","Fre"];
const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7)+(weekend?7:0));
function dateOf(d){const x=new Date(mon);x.setDate(mon.getDate()+d-1);return x.getDate()+"."+(x.getMonth()+1)+"."}

const S=()=>st[bld];
function renderBld(){
 $("bld").innerHTML=BK.map(b=>`<button class="${b===bld?"on":""}" aria-pressed="${b===bld}" data-b="${b}">${b}</button>`).join("");
 $("open").textContent=`${bld}: åpent ${BLD[bld].h} (eksempeltider). ${BLD[bld].txt}`;
 $("stockH").textContent="Hva er igjen i "+bld+"?";
}
function renderDays(){
 $("days").innerHTML=[1,2,3,4,5].map(d=>`<button role="tab" aria-selected="${d===day}" class="${d===day?"on":""}" data-d="${d}">${NAMES[d]}<span class="d">${d===dow?"i dag":dateOf(d)}</span></button>`).join("");
 $("diet").innerHTML=Object.entries(TAGN).map(([k,v])=>`<button class="${diet.has(k)?"on":""}" aria-pressed="${diet.has(k)}" data-t="${k}">${v}</button>`).join("");
}
function renderMenu(){
 $("note").innerHTML=weekend?`<div class="note">Kantina er stengt i helgen. Viser menyen for mandag.</div>`:"";
 let m=MENU[day].filter((x,ix)=>BLD[bld].hot.includes(ix)&&[...diet].every(t=>x.t.includes(t)||(t==="v"&&x.t.includes("vg"))));
 $("menu").innerHTML=m.length?m.map(x=>`<div class="dish ${x.t.length?"v":""}"><h3>${x.n}</h3><p>${x.d}</p><div class="price">${x.p} kr</div>
  <div class="tags">${x.t.map(t=>`<span class="tag">${TAGN[t]}</span>`).join("")}${x.a?`<span class="tag a">Allergener: ${x.a}</span>`:""}</div></div>`).join("")
  :`<div class="empty">Ingen retter passer filteret ditt denne dagen. Fjern et filter for å se hele menyen.</div>`;
}
function status(i){const l=S().left[i.id];if(l<=0)return["out","Utsolgt"];if(l<=3||l/i.max<=.2)return["low","Få igjen"];return["ok","På lager"]}
function renderCats(){
 $("cats").innerHTML=["Alle","Drikke","Mat","Snacks"].map(c=>`<button class="${c===cat?"on":""}" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
 $("onlyIn").className=only?"on":"";$("onlyIn").setAttribute("aria-pressed",only);
}
function renderStock(){
 const l=ITEMS.filter(i=>S().left[i.id]!==undefined&&(cat==="Alle"||i.cat===cat)&&(!only||staff||S().left[i.id]>0));
 $("stock").innerHTML=l.length?l.map(i=>{const [c,t]=status(i),n=S().left[i.id];
  return `<div class="item ${c}"><b>${i.n}</b><span class="st">${n>0?n+" igjen":""} ${t}</span>
  <div class="bar" role="img" aria-label="${n} av ${i.max}"><i style="width:${Math.round(n/i.max*100)}%"></i></div>
  ${staff?`<div class="staff"><button data-m="${i.id}" data-s="-1" ${n<=0?"disabled":""} aria-label="Ta bort én ${i.n}">−1</button><button data-m="${i.id}" data-s="1" ${n>=i.max?"disabled":""} aria-label="Legg til én ${i.n}">+1</button><button data-m="${i.id}" data-s="full">Fyll opp</button><button data-m="${i.id}" data-s="zero">Utsolgt</button></div>`:""}</div>`}).join("")
  :`<div class="empty">Ingenting å vise her. Alt i denne kategorien er utsolgt, eller så er den tom. Slå av «Skjul utsolgte» for å se alt.</div>`;
 $("upd").textContent=S().t?"Sist oppdatert av personalet i "+bld+": "+new Date(S().t).toLocaleString("no-NO",{weekday:"long",hour:"2-digit",minute:"2-digit"}):"Ikke oppdatert i dag (eksempeldata).";
}
const all=()=>{renderBld();renderDays();renderMenu();renderCats();renderStock()};
$("bld").onclick=e=>{const b=e.target.closest("[data-b]");if(b){bld=b.dataset.b;all()}};
$("days").onclick=e=>{const b=e.target.closest("[data-d]");if(b){day=+b.dataset.d;renderDays();renderMenu()}};
$("diet").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;const t=b.dataset.t;diet.has(t)?diet.delete(t):diet.add(t);renderDays();renderMenu()};
$("cats").onclick=e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;renderCats();renderStock()}};
$("onlyIn").onclick=()=>{only=!only;renderCats();renderStock()};
$("staffBtn").onclick=()=>{staff=!staff;$("staffBtn").className=staff?"on":"";$("staffBtn").setAttribute("aria-pressed",staff);renderStock()};
$("stock").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;const i=ITEMS[+b.dataset.m],s=b.dataset.s;let n=S().left[i.id];
 n=s==="full"?i.max:s==="zero"?0:Math.max(0,Math.min(i.max,n+ +s));S().left[i.id]=n;S().t=Date.now();save();renderStock()};
$("reset").onclick=()=>{if(confirm("Tilbakestille lageret i alle bygg til eksempeldata?")){st=mk();save();renderStock()}};
all();
</script>
</body>
</html>
